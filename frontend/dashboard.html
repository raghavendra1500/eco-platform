<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <script src="dashboard.js"></script>
  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>🌱 EcoLearn</h2>
      <ul>
        <li>Dashboard</li>
        <li>Tasks</li>
        <li>Leaderboard</li>
        <li>Profile</li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- TOP BAR -->
      <div class="topbar">
        <h3>Welcome, User 👋</h3>
        <span>Eco Points: <strong>120</strong></span>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="card">
          <h3>Level</h3>
          <p>Green Beginner 🌱</p>
        </div>

        <div class="card">
          <h3>Completed Tasks</h3>
          <p>8</p>
        </div>

        <div class="card">
          <h3>Rank</h3>
          <p>#5</p>
        </div>
      </div>

      <!-- TASKS -->
      <div class="tasks">
        <h2>Today's Challenges</h2>

        <div class="task-card">
          <h4>🌍 Avoid Plastic for a Day</h4>
          <p>Points: 20</p>
          <button>Submit</button>
        </div>

        <div class="task-card">
          <h4>💧 Save Water</h4>
          <p>Points: 15</p>
          <button>Submit</button>
        </div>

      </div>

      <!-- LEADERBOARD -->
      <div class="leaderboard">
        <h2>Top Students 🏆</h2>

        <div class="leader">
          <span>1. Rahul</span>
          <span>200 pts</span>
        </div>

        <div class="leader">
          <span>2. Priya</span>
          <span>180 pts</span>
        </div>

      </div>

    </main>
  </div>

</body>
</html>
